[workspace]
channels = ["conda-forge"]
name = "cuda-exercise"
platforms = [
    "linux-64", "osx-arm64", "win-64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
    { name = "win-64-cuda", platform = "win-64", cuda = "12" }
]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.13.5,<3.14"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.14.1,<3"

[feature.gpu]
platforms = ["linux-64-cuda", "win-64-cuda"]

[feature.gpu.dependencies]
pytorch-gpu = ">=2.13.0,<3"

[environments]
cpu = ["cpu"]
gpu = ["gpu"]
